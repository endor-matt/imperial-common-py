[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imperial-common"
version = "1.0.0"
description = "Shared Python utilities for Death Star Operations Platform"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.20.0",
    "pyyaml>=5.0",
    "lxml>=4.9.0",
    "pycryptodome>=3.9.0",
]
